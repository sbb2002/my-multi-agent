<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent Demo</title>
  <!-- HTMX: HTML 속성만으로 동적 요청 처리 -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <!-- Bootstrap: 빠른 스타일링 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card-header.bg-agent { background: #e8f4fd; font-weight: 600; }
    .card-header.bg-summary { background: #6610f2; color: white; font-weight: 600; }
    pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; margin: 0; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
    /* 마크다운 내부 요소 간격 및 스타일 */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin-top: 1rem;
      font-weight: 700;
    }
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.5rem;
    }
    .markdown-body blockquote {
      border-left: 4px solid #dee2e6;
      padding-left: 1rem;
      color: #6c757d;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container py-5" style="max-width: 860px">

  <div class="mb-5">
    <h1 class="fw-bold">🤖 Multi-Agent Demo</h1>
    <p class="text-muted">FastAPI + HTMX + Anthropic SDK — 앙상블 & 파이프라인 패턴</p>
  </div>

  <!-- 탭 -->
  <ul class="nav nav-tabs mb-4" id="mainTab">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#ensemble-tab">
        ⚡ 앙상블 패턴
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pipeline-tab">
        🔗 파이프라인 패턴
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ── 앙상블 탭 ─────────────────────────────────────────── -->
    <div class="tab-pane fade show active" id="ensemble-tab">
      <div class="alert alert-info mb-4" style="font-size:0.9rem">
        <strong>앙상블 패턴</strong>: 분석가·비평가·낙관론자 3개 에이전트가 <em>동시에</em> 실행되고,
        종합 에이전트가 결과를 통합합니다. (<code>asyncio.gather</code>)
      </div>

      <!--
        hx-post: 폼 데이터를 /ensemble로 POST
        hx-target: 응답 HTML을 삽입할 곳
        hx-indicator: 로딩 중 표시할 요소
        JS 없이 이 속성들만으로 동작합니다.
      -->
      <form hx-post="/ensemble"
            hx-target="#ensemble-result"
            hx-indicator="#ensemble-spinner"
            hx-swap="innerHTML">
        <div class="input-group mb-3">
          <input type="text"
                 name="topic"
                 class="form-control form-control-lg"
                 placeholder="분석할 주제를 입력하세요 (예: AI가 일자리에 미치는 영향)"
                 required>
          <button class="btn btn-primary btn-lg" type="submit">
            3개 에이전트 동시 분석
          </button>
        </div>
        <div id="ensemble-spinner" class="htmx-indicator text-muted mb-3">
          ⏳ 에이전트 3개 동시 실행 중...
        </div>
      </form>

      <!-- HTMX가 /ensemble 응답을 여기에 삽입 -->
      <div id="ensemble-result"></div>
    </div>

    <!-- ── 파이프라인 탭 ──────────────────────────────────────── -->
    <div class="tab-pane fade" id="pipeline-tab">
      <div class="alert alert-info mb-4" style="font-size:0.9rem">
        <strong>파이프라인 패턴</strong>: 기획→작성→비평→최종화 순으로 실행되며,
        각 단계가 완료될 때마다 SSE로 실시간 전송됩니다.
      </div>

      <div class="input-group mb-3">
        <input type="text"
               id="pipeline-topic"
               class="form-control form-control-lg"
               placeholder="블로그 주제를 입력하세요 (예: 효과적인 시간 관리법)"
               required>
        <button class="btn btn-primary btn-lg" onclick="startPipeline()">
          4단계 파이프라인 실행
        </button>
      </div>
      <div id="pipeline-status" class="text-muted mb-3" style="display:none">
        ⏳ 파이프라인 실행 중...
      </div>

      <!-- 단계별 카드가 여기에 순서대로 추가됩니다 -->
      <div id="pipeline-steps"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 파이프라인: SSE 스트림을 읽어 단계별로 카드 추가
  async function startPipeline() {
    const topic = document.getElementById('pipeline-topic').value.trim();
    if (!topic) return alert('주제를 입력해주세요!');

    const container = document.getElementById('pipeline-steps');
    const status = document.getElementById('pipeline-status');
    container.innerHTML = '';
    status.style.display = 'block';

    const stepColors = { '기획': 'primary', '작성': 'success', '비평': 'warning', '최종화': 'danger' };
    const stepIcons  = { '기획': '📋', '작성': '✍️', '비평': '🔎', '최종화': '✨' };

    try {
      const resp = await fetch('/pipeline/stream', {
        method: 'POST',
        body: new URLSearchParams({ topic }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        // SSE 파싱: "data: 단계명||결과내용"
        for (const line of text.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          const sep = payload.indexOf('||');
          if (sep === -1) continue;

          const stepName = payload.slice(0, sep);
          const result   = payload.slice(sep + 2).replace(/↵/g, '\n');
          const color    = stepColors[stepName] || 'secondary';
          const icon     = stepIcons[stepName]  || '🔹';

          const htmlContent = marked.parse(result);
          container.innerHTML += `
            <div class="card mb-3 border-${color}">
            <div class="card-header text-bg-${color} fw-bold">
              ${icon} Step: ${stepName}
            </div>
            <div class="card-body markdown-body">
              ${htmlContent}
            </div>
          </div>`;

          // container.innerHTML += `
          //   <div class="card mb-3 border-${color}">
          //     <div class="card-header text-bg-${color} fw-bold">
          //       ${icon} Step: ${stepName}
          //     </div>
          //     <div class="card-body">
          //       <pre>${result}</pre>
          //     </div>
          //   </div>`;
          // 새 카드로 스크롤
          container.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }
    } finally {
      status.style.display = 'none';
    }
  }
</script>
</body>
</html>
